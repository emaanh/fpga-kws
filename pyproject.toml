[project]
name = "kws"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "torch",
    "tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/kws"]

[dependency-groups]
dev = [
    "cocotb>=2.1.0",
    "pytest>=9.1.1",
]
